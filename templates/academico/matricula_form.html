{% extends "base.html" %}

{% block title %}
    {% if object %}Editar matrícula{% else %}Crear matrícula{% endif %}
    | Gestión de alumnos
{% endblock %}

{% block content %}
    <h1>{% if object %}Editar matrícula{% else %}Crear matrícula{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'academico:matricula_lista' %}">Cancelar</a>
    </form>
{% endblock %}
