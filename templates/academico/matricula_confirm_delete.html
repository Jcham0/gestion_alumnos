{% extends "base.html" %}

{% block title %}Eliminar matrícula | Gestión de alumnos{% endblock %}

{% block content %}
    <h1>Eliminar matrícula</h1>
    <p>¿Seguro que quieres eliminar {{ object }}?</p>
    <p>También se eliminarán las notas asociadas a esta matrícula.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmar eliminación</button>
        <a href="{% url 'academico:matricula_lista' %}">Cancelar</a>
    </form>
{% endblock %}
