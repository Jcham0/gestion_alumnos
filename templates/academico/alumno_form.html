{% extends "base.html" %}

{% block title %}
    {% if object %}Editar alumno{% else %}Añadir alumno{% endif %} | Gestión de alumnos
{% endblock %}

{% block content %}
    <h1>{% if object %}Editar alumno{% else %}Añadir alumno{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
        <a href="{% url 'academico:alumno_lista' %}">Cancelar</a>
    </form>
{% endblock %}
